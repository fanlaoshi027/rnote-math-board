name: macOS Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          brew update
          brew install ninja meson glib appstream gtk4 desktop-file-utils libadwaita cmake pkg-config gettext

      - name: Fetch Rnote source
        run: |
          git clone --depth 1 https://github.com/flxzt/rnote.git rnote-src
          cd rnote-src
          git submodule update --init --recursive

      - name: Configure Rnote with Meson
        working-directory: rnote-src
        run: |
          meson setup --prefix="$GITHUB_WORKSPACE/stage/usr/local" -Dprofile=default -Dcli=false _mesonbuild

      - name: Build Rnote
        working-directory: rnote-src
        run: |
          meson compile -C _mesonbuild

      - name: Stage installation
        working-directory: rnote-src
        run: |
          rm -rf "$GITHUB_WORKSPACE/stage"
          mkdir -p "$GITHUB_WORKSPACE/stage"
          meson install -C _mesonbuild --destdir "$GITHUB_WORKSPACE/stage"

      - name: Inspect build output
        run: |
          find "$GITHUB_WORKSPACE/stage" -maxdepth 6 -type f | sort | head -200

      - name: Package macOS test app
        run: |
          APP="$GITHUB_WORKSPACE/dist/墨写.app"
          rm -rf "$GITHUB_WORKSPACE/dist"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"
          cp "$GITHUB_WORKSPACE/stage/usr/local/bin/rnote" "$APP/Contents/MacOS/rnote"
          cp -R "$GITHUB_WORKSPACE/stage/usr/local/share/." "$APP/Contents/Resources/"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleName</key><string>墨写</string>
          <key>CFBundleDisplayName</key><string>墨写</string>
          <key>CFBundleIdentifier</key><string>com.fanlaoshi.moxie</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleExecutable</key><string>rnote</string>
          <key>CFBundleVersion</key><string>0.1.0</string>
          <key>CFBundleShortVersionString</key><string>0.1.0</string>
          </dict></plist>
          PLIST
          chmod +x "$APP/Contents/MacOS/rnote"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          hdiutil create -volname 墨写 -srcfolder "$APP" -ov -format UDZO "$GITHUB_WORKSPACE/dist/墨写-第一版-手写测试.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: moxie-macos-v0.1.0
          path: dist/墨写-第一版-手写测试.dmg
          if-no-files-found: error
