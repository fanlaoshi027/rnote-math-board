name: macOS Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          set -euxo pipefail
          brew install ninja meson glib appstream gtk4 desktop-file-utils libadwaita cmake pkg-config gettext dylibbundler
      - name: Fetch Rnote source
        run: |
          git clone --depth 1 https://github.com/flxzt/rnote.git rnote-src
          cd rnote-src
          git submodule update --init --recursive
      - name: Apply Moxie pen feel
        run: |
          chmod +x moxie/apply-pen-feel.sh
          ./moxie/apply-pen-feel.sh "$GITHUB_WORKSPACE/rnote-src"
      - name: Configure Rnote with Meson
        working-directory: rnote-src
        run: meson setup --prefix=/usr/local -Dprofile=default -Dcli=false _mesonbuild
      - name: Build Rnote
        working-directory: rnote-src
        run: meson compile -C _mesonbuild
      - name: Stage installation
        working-directory: rnote-src
        run: |
          rm -rf "$GITHUB_WORKSPACE/stage"
          mkdir -p "$GITHUB_WORKSPACE/stage"
          meson install -C _mesonbuild --destdir "$GITHUB_WORKSPACE/stage"
      - name: Package portable macOS app
        run: |
          set -euxo pipefail
          APP="$GITHUB_WORKSPACE/dist/墨写.app"
          rm -rf "$GITHUB_WORKSPACE/dist"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" "$APP/Contents/Frameworks"
          cp "$GITHUB_WORKSPACE/stage/usr/local/bin/rnote" "$APP/Contents/MacOS/rnote-bin"
          cp -R "$GITHUB_WORKSPACE/stage/usr/local/share/." "$APP/Contents/Resources/"
          dylibbundler -od -b -x "$APP/Contents/MacOS/rnote-bin" -d "$APP/Contents/Frameworks/" -p '@executable_path/../Frameworks'
          cat > "$GITHUB_WORKSPACE/launcher.c" <<'C'
          #include <limits.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          int main(int argc, char **argv) {
              char exe[PATH_MAX];
              if (!realpath(argv[0], exe)) return 127;
              char *slash = strrchr(exe, '/');
              if (!slash) return 127;
              *slash = '\0';
              char *macos = exe;
              char *contents = strrchr(macos, '/');
              if (!contents) return 127;
              *contents = '\0';
              char schema[PATH_MAX], data[PATH_MAX], target[PATH_MAX];
              snprintf(schema, sizeof(schema), "%s/Resources/glib-2.0/schemas", macos);
              snprintf(data, sizeof(data), "%s/Resources", macos);
              snprintf(target, sizeof(target), "%s/MacOS/rnote-bin", macos);
              setenv("GSETTINGS_SCHEMA_DIR", schema, 1);
              setenv("XDG_DATA_DIRS", data, 1);
              execv(target, argv);
              return 127;
          }
          C
          clang -O2 -Wall "$GITHUB_WORKSPACE/launcher.c" -o "$APP/Contents/MacOS/rnote"
          chmod +x "$APP/Contents/MacOS/rnote"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleName</key><string>墨写</string>
          <key>CFBundleDisplayName</key><string>墨写</string>
          <key>CFBundleIdentifier</key><string>com.fanlaoshi.moxie</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleExecutable</key><string>rnote</string>
          <key>CFBundleVersion</key><string>0.2.4</string>
          <key>CFBundleShortVersionString</key><string>0.2.4</string>
          <key>LSMinimumSystemVersion</key><string>13.0</string>
          </dict></plist>
          PLIST
          SCHEMA="$APP/Contents/Resources/glib-2.0/schemas"
          mkdir -p "$SCHEMA"
          find "$APP/Contents/Resources" -name '*.gschema.xml' -print
          GTK_PREFIX="$(brew --prefix gtk4)"
          GTK_SHARE="$GTK_PREFIX/share"
          if [ -d "$GTK_SHARE/glib-2.0/schemas" ]; then
            find "$GTK_SHARE/glib-2.0/schemas" -maxdepth 1 -type f -name '*.xml' -exec cp -f {} "$SCHEMA/" \;
          fi
          if [ -d "$GTK_SHARE/gtk-4.0" ]; then
            mkdir -p "$APP/Contents/Resources/gtk-4.0"
            cp -R "$GTK_SHARE/gtk-4.0/." "$APP/Contents/Resources/gtk-4.0/"
          fi
          glib-compile-schemas "$SCHEMA"
          test -s "$SCHEMA/gschemas.compiled"
          GSETTINGS_SCHEMA_DIR="$SCHEMA" gsettings list-schemas | grep -q rnote
          GSETTINGS_SCHEMA_DIR="$SCHEMA" gsettings list-schemas | grep -q 'org.gtk.gtk4.Settings.EmojiChooser'
          xattr -cr "$APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo '--- Smoke test ---'
          "$APP/Contents/MacOS/rnote" >/tmp/moxie-smoke.log 2>&1 &
          PID=$!
          sleep 8
          if ! kill -0 "$PID" 2>/dev/null; then
            cat /tmp/moxie-smoke.log || true
            exit 1
          fi
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          mkdir -p "$GITHUB_WORKSPACE/dmg-root"
          cp -R "$APP" "$GITHUB_WORKSPACE/dmg-root/"
          ln -s /Applications "$GITHUB_WORKSPACE/dmg-root/Applications"
          hdiutil create -volname 墨写 -srcfolder "$GITHUB_WORKSPACE/dmg-root" -ov -format UDZO "$GITHUB_WORKSPACE/dist/墨写-第一版-手写测试.dmg"
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: moxie-macos-v0.2.4
          path: dist/墨写-第一版-手写测试.dmg
          if-no-files-found: error
