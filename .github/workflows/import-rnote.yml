name: Import Rnote Upstream

on:
  workflow_dispatch:
  push:
    branches:
      - math-ui-v1
    paths:
      - '.github/workflows/import-rnote.yml'

permissions:
  contents: write

jobs:
  import-rnote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout math board
        uses: actions/checkout@v4
        with:
          ref: math-ui-v1
          fetch-depth: 0

      - name: Clone Rnote upstream
        run: git clone --depth 1 https://github.com/flxzt/rnote.git /tmp/rnote

      - name: Import Rnote source
        run: |
          rm -rf .rnote-upstream
          mkdir -p .rnote-upstream
          cp -a /tmp/rnote/. .rnote-upstream/
          rm -rf .rnote-upstream/.git
          printf '%s\n' 'Rnote upstream source snapshot used as the initial technical base.' > .rnote-upstream/UPSTREAM.md

      - name: Commit imported source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .rnote-upstream
          git diff --cached --quiet && exit 0
          git commit -m 'chore: import Rnote upstream source'
          git push origin math-ui-v1
